name: build

# Every push builds the runtime in its pinned container, fetches the models
# the release lists, assembles a release, smoke-tests it and benches it
# against bench/baseline.json. A tag v<N> also publishes it as a GitHub
# release: the only way a release is made, and only once the bench passes.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CONTAINER_ENGINE: docker
      # The Sail Scoring branch whose lib/voice/calls.ts the bench reads
      # words with: the one finishes by voice is on.
      APP_REF: main
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Model archives
        uses: actions/cache@v6
        with:
          path: build/archives
          key: archives-${{ hashFiles('models/models.yaml') }}
          restore-keys: archives-

      - name: Build the runtime
        run: scripts/build.sh sherpa-onnx

      - name: Fetch the models
        run: node scripts/fetch-models.mjs

      - name: Assemble
        run: node scripts/assemble.mjs --release "$RELEASE"

      - name: Smoke test
        run: node scripts/smoke-test.mjs "dist/$RELEASE"

      # The bench reads words with the app's own lib/voice/calls.ts.
      - name: The app's reading of calls
        uses: actions/checkout@v7
        with:
          repository: sailscoring/sailscoring
          ref: ${{ env.APP_REF }}
          path: app
          sparse-checkout: lib/voice/calls.ts
          sparse-checkout-cone-mode: false

      - name: Bench sessions
        uses: actions/cache@v6
        with:
          path: build/sessions/*.tar.xz
          key: sessions-${{ hashFiles('bench/sessions.json') }}

      - name: Bench
        run: |
          if [ ! -f app/lib/voice/calls.ts ]; then
            echo "::warning::sailscoring@$APP_REF has no lib/voice/calls.ts: the bench did not run"
            echo "The bench did not run: sailscoring@$APP_REF has no lib/voice/calls.ts." >> "$GITHUB_STEP_SUMMARY"
            # A release is never published without being benched.
            [[ $GITHUB_REF == refs/tags/v* ]] && exit 1
            exit 0
          fi
          node scripts/fetch-sessions.mjs
          node bench/run.mjs "dist/$RELEASE" --app app --out "dist/bench-$RELEASE.json" --baseline bench/baseline.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RELEASE }}
          path: |
            dist/${{ env.RELEASE }}-assets/
            dist/bench-${{ env.RELEASE }}.json
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE" "dist/$RELEASE-assets/"* \
            --title "$RELEASE" \
            --notes-file <(node scripts/release-notes.mjs "dist/$RELEASE")
